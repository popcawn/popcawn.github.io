<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop Sims</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script>try{ if(localStorage.getItem('sims_theme')==='dim') document.documentElement.dataset.theme='dim'; }catch(e){}</script>
<style>
  /* the sims' look: light by default, 🌙 dim when you picked it in any sport */
  :root{--bg:#eef2f8;--panel:#ffffff;--panel2:#f4f7fb;--line:#e2e8f0;--line2:#d2dbe7;--ink:#0f1726;--ink2:#3b485c;--ink3:#66758b;--accent:#2f6fe4;--accent2:#6a55f0;--good:#0b9a5e;--bad:#d93a48;
    --shadow:0 1px 2px rgba(15,23,38,.05),0 10px 28px -16px rgba(15,23,38,.22)}
  :root[data-theme="dim"]{--bg:#121822;--panel:#1b2332;--panel2:#232d40;--line:#2b3649;--line2:#38465e;--ink:#eef3fa;--ink2:#b6c2d4;--ink3:#8b99ae;--accent:#5aa2ff;--accent2:#8f84ff;--good:#2fd38c;--bad:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.65)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 500px at 0% -8%,rgba(47,111,228,.12),transparent 60%),radial-gradient(800px 460px at 100% 0%,rgba(106,85,240,.10),transparent 60%),var(--bg)}
  main{width:100%;max-width:560px;padding:28px 16px}
  h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:30px;letter-spacing:-.5px;margin:0 0 4px;display:flex;align-items:center;gap:12px}
  h1 i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px -8px var(--accent)}
  .sub{color:var(--ink3);font-size:14px;margin-bottom:20px}
  .pot{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .pot b{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:30px;letter-spacing:-1px}
  .pot small{display:block;color:var(--ink3);font-size:13.5px;margin-top:2px}
  a.sport{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 12px;color:var(--ink);text-decoration:none;font-weight:800;font-size:19px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  a.sport:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.sport span.e{font-size:30px}
  a.sport small{display:block;color:var(--ink3);font-weight:500;font-size:13px}
  a.sport .open{margin-left:auto;font-size:13px;color:var(--accent);font-weight:800;white-space:nowrap}
  .ev-pos{color:var(--good)} .ev-neg{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1><i></i>Prop Sims</h1>
  <div class="sub">One bankroll for every sport. Tap a sport.</div>
  <div class="pot" id="pot"></div>
  <a class="sport" href="/nfl-td-predictor/"><span class="e">🏈</span><div>NFL<small>anytime TDs · player props · fun picks</small></div><span class="open" id="o_nfl"></span></a>
  <a class="sport" href="/nba-prop-predictor/"><span class="e">🏀</span><div>NBA<small>points · rebounds · assists · threes · PRA</small></div><span class="open" id="o_nba"></span></a>
  <a class="sport" href="/nhl-prop-predictor/"><span class="e">🏒</span><div>NHL<small>shots on goal · points · anytime goal (shown)</small></div><span class="open" id="o_nhl"></span></a>
</main>
<script>
// the front door: reads the apps' shared storage (same site) — the pot (nfltd_bank) and each sport's open bets
(function(){
  const lsJ=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
  const dec=s=>{ const a=parseFloat(String(s).replace('−','-')); return a>0?1+a/100:a<0?1+100/-a:1; };
  const fmt=x=>{ const a=Math.abs(x); return (x<0?'−':'')+'$'+(a>=20?Math.round(a).toLocaleString():a.toFixed(2)); };
  const B=lsJ('nfltd_bank',{})||{}, S={nfl:'nfltd_bets', nba:'nbap_bets', nhl:'nhlp_bets'};
  let pl=0, open=0;
  for(const [k,key] of Object.entries(S)){ const L=lsJ(key,[])||[]; let o=0;
    for(const b of L){ if(b.result==='pending'){ o++; continue; } if(B.amt&&b.st>B.at){ const u=b.usd!=null?+b.usd:(+b.stake||0)*B.amt/100; pl+=b.result==='win'?u*(dec(b.odds)-1):b.result==='loss'?-u:0; } }
    open+=o; const el=document.getElementById('o_'+k); if(el&&o) el.textContent=o+' open'; }
  document.getElementById('pot').innerHTML=B.amt
    ? `💰 <b>${fmt(Math.max(0,B.amt+pl))}</b><small><span class="${pl>0?'ev-pos':pl<0?'ev-neg':''}">${pl>=0?'+':''}${fmt(pl)}</span> since ${new Date(B.at).toLocaleDateString([], {month:'short', day:'numeric'})}${open?` · ${open} open bet${open>1?'s':''}`:''}</small>`
    : '💰 <b style="font-size:16px">Set your bankroll in any sport</b><small>it becomes one pot for all three</small>';
})();
</script>
</body>
</html>
